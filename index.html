<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:black;
  color:cyan;
  font-family:Arial;
  text-align:center;
}
button{
  padding:15px 25px;
  font-size:18px;
  border-radius:50px;
  border:none;
  background:cyan;
}
#log{
  margin-top:20px;
  font-size:16px;
}
</style>
</head>
<body>

<h1>🤖 JARVIS</h1>
<p>Say anything like:<br>
<b>"Jarvis hello"</b><br>
<b>"Jarvis open my YouTube"</b>
</p>

<button onclick="startJarvis()">🎤 Start Jarvis</button>
<div id="log"></div>

<script>
const log = document.getElementById("log");

const yt = "https://www.youtube.com/@YOURCHANNEL"; // 🔴 change this
const insta = "https://www.instagram.com/YOURUSERNAME"; // 🔴 change this

let recognition;

function startJarvis(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.start();

  speak("Jarvis online, I am listening");

  recognition.onresult = (event) => {
    const command = event.results[event.results.length - 1][0].transcript.toLowerCase();
    log.innerHTML += "<br>🗣️ " + command;
    processCommand(command);
  };
}

function processCommand(cmd){

  if(!cmd.includes("jarvis")) return;

  if(cmd.includes("hello")){
    speak("Hello sir, how are you?");
  }

  else if(cmd.includes("open my youtube")){
    speak("Opening your YouTube channel");
    window.open(yt, "_blank");
  }

  else if(cmd.includes("open my instagram")){
    speak("Opening your Instagram");
    window.open(insta, "_blank");
  }

  else if(cmd.includes("who are you")){
    speak("I am Jarvis, your personal AI assistant");
  }

  else{
    speak("I heard you sir, but I am still learning");
  }
}

function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
