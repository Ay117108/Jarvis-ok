<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:black;
  color:#00eaff;
  font-family:Arial, sans-serif;
  text-align:center;
  overflow:hidden;
}

#face{
  width:200px;
  height:200px;
  border-radius:50%;
  border:4px solid #00eaff;
  margin:30px auto;
  box-shadow:0 0 30px #00eaff;
  animation:pulse 2s infinite;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

@keyframes pulse{
  0%{ box-shadow:0 0 10px #00eaff; }
  50%{ box-shadow:0 0 45px #00eaff; }
  100%{ box-shadow:0 0 10px #00eaff; }
}

button{
  padding:14px 28px;
  font-size:18px;
  border:none;
  border-radius:50px;
  background:#00eaff;
  color:black;
  cursor:pointer;
}

#log{
  margin-top:15px;
  max-height:220px;
  overflow:auto;
  padding:10px;
  font-size:14px;
}
</style>
</head>

<body>

<h2>🤖 JARVIS AI</h2>

<div id="face">STANDBY</div>

<p>
Say: <br>
<b>Jarvis</b><br>
<b>Jarvis open YouTube</b><br>
<b>Jarvis search Elon Musk</b>
</p>

<button onclick="startJarvis()">🎤 Activate Jarvis</button>

<div id="log"></div>

<script>
let recognition;
let active = false;
const log = document.getElementById("log");
const face = document.getElementById("face");

function startJarvis(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("Speech Recognition not supported");
    return;
  }

  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.continuous = true;
  recognition.start();

  speak("Jarvis online. Ready sir.");
  face.innerText = "LISTENING";

  recognition.onresult = (e)=>{
    const text = e.results[e.results.length-1][0].transcript.toLowerCase();
    addLog("🗣️ " + text);
    processCommand(text);
  };
}

function processCommand(text){

  if(text.includes("jarvis")){
    active = true;
    speak("Yes sir, boliye");
    return;
  }

  if(!active) return;

  if(text.includes("open youtube")){
    speak("Opening YouTube");
    window.open("https://youtube.com","_blank");
  }

  else if(text.includes("open instagram")){
    speak("Opening Instagram");
    window.open("https://instagram.com","_blank");
  }

  else if(text.includes("open whatsapp")){
    speak("Opening WhatsApp");
    window.open("https://wa.me","_blank");
  }

  else if(text.includes("search")){
    const q = text.replace("search","").trim();
    speak("Searching on Google");
    window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
  }

  else{
    speak("Searching answer");
    window.open("https://www.google.com/search?q="+encodeURIComponent(text),"_blank");
  }

  active = false;
}

function speak(msg){
  addLog("🤖 " + msg);
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = "hi-IN";
  u.rate = 1.25;
  speechSynthesis.speak(u);
}

function addLog(m){
  log.innerHTML += m + "<br>";
  log.scrollTop = log.scrollHeight;
}
</script>

</body>
</html>
