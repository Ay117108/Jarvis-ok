<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:black;
  color:#00eaff;
  font-family:Arial, sans-serif;
  text-align:center;
  overflow:hidden;
}

/* JARVIS FACE */
#face{
  width:200px;
  height:200px;
  border-radius:50%;
  border:4px solid #00eaff;
  margin:40px auto;
  box-shadow:0 0 30px #00eaff;
  animation:pulse 2s infinite;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

@keyframes pulse{
  0%{ box-shadow:0 0 10px #00eaff; }
  50%{ box-shadow:0 0 40px #00eaff; }
  100%{ box-shadow:0 0 10px #00eaff; }
}

button{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:50px;
  background:#00eaff;
  color:black;
  cursor:pointer;
}

#log{
  margin-top:20px;
  max-height:200px;
  overflow:auto;
  padding:10px;
  font-size:14px;
}
</style>
</head>

<body>

<h1>🤖 JARVIS</h1>

<div id="face">ONLINE</div>

<p>Say:<br>
<b>Jarvis</b><br>
<b>Jarvis who is Elon Musk</b><br>
<b>Jarvis open YouTube</b>
</p>

<button onclick="startJarvis()">🎤 Activate Jarvis</button>

<div id="log"></div>

<script>
let recognition;
let waiting = false;
const log = document.getElementById("log");

function startJarvis(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.continuous = true;
  recognition.start();

  speakFast("Jarvis online. Ready sir.");

  recognition.onresult = (e)=>{
    const text = e.results[e.results.length-1][0].transcript.toLowerCase();
    addLog("🗣️ " + text);
    handle(text);
  };
}

function handle(text){

  if(text.includes("jarvis")){
    speakFast("Yes sir");
    waiting = true;
    return;
  }

  if(!waiting) return;

  // OPEN YOUTUBE
  if(text.includes("open") && text.includes("youtube")){
    speakFast("Opening YouTube");
    window.open("https://youtube.com","_blank");
  }

  // GOOGLE SEARCH + ANSWER STYLE
  else{
    speakFast("Searching on Google sir");
    window.open("https://www.google.com/search?q=" + encodeURIComponent(text), "_blank");
  }

  waiting = false;
}

function speakFast(msg){
  addLog("🤖 " + msg);
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = "hi-IN";
  u.rate = 1.2; // fast Iron Man style
  speechSynthesis.speak(u);
}

function addLog(m){
  log.innerHTML += m + "<br>";
  log.scrollTop = log.scrollHeight;
}
</script>

</body>
</html>
