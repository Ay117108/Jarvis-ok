<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background: black;
    color: cyan;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
  }
  .jarvis {
    margin-top: 80px;
  }
  button {
    background: cyan;
    color: black;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 50px;
    cursor: pointer;
  }
  #output {
    margin-top: 20px;
    font-size: 18px;
  }
</style>
</head>

<body>

<div class="jarvis">
  <h1>🤖 JARVIS</h1>
  <p>Say: <b>Hey Jarvis</b></p>
  <button onclick="startListening()">🎤 Speak</button>
  <p id="output"></p>
</div>

<script>
const output = document.getElementById("output");

function startListening() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function(event) {
    let command = event.results[0][0].transcript.toLowerCase();
    output.innerText = "You: " + command;
    jarvis(command);
  }
}

function jarvis(command) {

  if (!command.includes("jarvis")) {
    speak("Please call me by my name sir");
    return;
  }

  if (command.includes("hello")) {
    speak("Hello sir, how can I help you?");
  }
  else if (command.includes("open youtube")) {
    speak("Opening YouTube");
    window.open("https://youtube.com", "_blank");
  }
  else if (command.includes("search")) {
    let query = command.replace("jarvis", "").replace("search", "");
    speak("Searching " + query);
    window.open("https://www.google.com/search?q=" + query);
  }
  else {
    speak("Sorry sir, I am still learning.");
  }
}

function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speech.rate = 1;
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
